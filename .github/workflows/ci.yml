name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: acme_booking_test
          TZ: Africa/Nairobi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/acme_booking_test
          TIMEZONE: Africa/Nairobi
        run: |
          alembic upgrade head

      - name: Run Test Suite (pytest)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/acme_booking_test
          TIMEZONE: Africa/Nairobi
        run: |
          pytest -v

  deploy:
    name: Deploy to VPS (Coolify)
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "[!] COOLIFY_WEBHOOK_URL secret is not configured in repository settings."
            echo "[*] Skipping webhook call. Once configured, Coolify will auto-deploy on staging pushes."
            exit 0
          fi
          echo "[*] Triggering Coolify deployment webhook..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl -f -X POST "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" || \
            curl -f -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
          else
            curl -f -X POST "$COOLIFY_WEBHOOK" || curl -f -X GET "$COOLIFY_WEBHOOK"
          fi
          echo "[+] Deployment trigger sent successfully!"
